name = "katia-skills"
main = "src/index.js"
compatibility_date = "2026-11-24"
workers_dev = true

[vars]
ALLOWED_ORIGINS = ""

[[d1_databases]]
binding = "DB"
database_name = "katia-skills-registry"
database_id = "28cfefc5-71b1-471f-b77e-219fae6a9eb4"
migrations_dir = "migrations"

# Configure secrets before deployment:
# npx wrangler secret put SKILLS_API_TOKEN
# Optional, for higher GitHub API rate limits:
# npx wrangler secret put GITHUB_TOKEN

# R2 binding will be added after R2 is enabled and the bucket is created.
