name: Katia Tutor syntax check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/katia-tutor-1.0]

# This workflow only checks source syntax. It must never call the production
# Worker or consume provider credits from an untrusted pull request.
permissions:
  contents: read

concurrency:
  group: katia-tutor-syntax-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inline-javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(
              r"<script\b(?![^>]*\bsrc=)[^>]*>(.*?)</script\s*>",
              html,
              re.I | re.S,
          )
          if not scripts:
              raise SystemExit("No inline scripts found")

          out = Path("/tmp/katia-inline-scripts")
          out.mkdir(exist_ok=True)
          for i, source in enumerate(scripts, 1):
              (out / f"script-{i}.js").write_text(source, encoding="utf-8")
          print(f"Found {len(scripts)} inline script blocks")
          PY

          for file in /tmp/katia-inline-scripts/*.js; do
            echo "Checking $file"
            node --check "$file"
          done
