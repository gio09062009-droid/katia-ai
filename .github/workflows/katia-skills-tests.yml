name: Katia Skills checks

on:
  pull_request:
    paths:
      - "workers/katia-skills/**"
      - ".github/workflows/katia-skills-tests.yml"
  push:
    branches:
      - "feature/katia-skills-foundation"
    paths:
      - "workers/katia-skills/**"

permissions:
  contents: read

jobs:
  analyzer-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/katia-skills
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run analyzer tests
        run: npm test
